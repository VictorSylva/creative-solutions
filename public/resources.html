<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resource & Knowledge Centre — Creative Solutions</title>
  <meta name="description" content="Access free guides, business plans validation worksheets, startup checklists, and strategic articles by Blessing Udechukwu.">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- DYNAMICALLY LOADED HEADER -->
  <header></header>

  <!-- DYNAMIC PAGE HEADER -->
  <section class="page-header">
    <div class="container grid-2" style="align-items: center;">
      <div>
        <span class="section-tag" id="resources-header-tag">Educational Support</span>
        <h1 id="resources-header-title">Resource Centre</h1>
        <p id="resources-header-desc">Loading articles...</p>
      </div>
      <div class="page-header-image">
        <img src="asset/audience-1.png" alt="Business Validation Resources" style="width: 100%; height: 200px; object-fit: cover; border-radius: var(--radius-sm); border: 1px solid var(--color-border); box-shadow: var(--shadow-subtle);" />
      </div>
    </div>
  </section>

  <!-- DYNAMIC CONTENT CONTAINER -->
  <section class="resources-feed-section" style="background-color: var(--color-milk);">
    <div class="container" id="resources-main-container" style="padding-top: 2rem; padding-bottom: 5rem;">
      <!-- Content Injected via main.js -->
      <div style="text-align: center; padding: 4rem 0; color: var(--color-gray);">Loading resource feeds...</div>
    </div>
  </section>

  <!-- CTA BANNER -->
  <section class="resources-cta" style="background-color: var(--color-white); border-top: 1px solid var(--color-border); text-align: center;">
    <div class="container" style="max-width: 600px;">
      <span class="section-tag">Value First</span>
      <h2>Apply these concepts to your startup</h2>
      <p style="margin-top: 0.5rem; margin-bottom: 2rem;">Not sure if your business is structured correctly? Get a detailed gap report using our online assessment.</p>
      <a href="assessment.html" class="btn btn-primary">Take Business Assessment</a>
    </div>
  </section>

  <!-- DYNAMICALLY LOADED FOOTER -->
  <footer></footer>

  <!-- SCRIPT LOADING -->
  <script src="js/components.js"></script>
  <script src="js/chat.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
